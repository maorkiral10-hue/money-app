<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="הכסף שלי">
<title>הכסף שלי</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #f6f7f5; --card: #ffffff; --text: #1c2321; --muted: #5f6b67;
    --accent: #0f766e; --ok: #15803d; --bad: #b45309; --line: #e3e7e4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111615; --card: #1b2220; --text: #e8eeec; --muted: #9aa8a3;
      --accent: #2dd4bf; --ok: #4ade80; --bad: #fbbf24; --line: #2a3431;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .card h2 { font-size: 16px; margin: 0 0 10px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .row:first-of-type { border-top: 0; }
  .row .v { font-weight: 600; text-align: left; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  textarea {
    width: 100%; min-height: 70px; font: inherit; font-size: 16px; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; resize: vertical;
  }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px 16px;
    background: var(--accent); color: #fff; width: 100%; margin-top: 10px;
  }
  @media (prefers-color-scheme: dark) { button { color: #06201d; } }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 8px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  li .t { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); font-size: 14px; }
  #update { display: none; background: var(--accent); color: #fff; }
  #update p { margin: 0; }
  #update button { background: #fff; color: #0f766e; }
</style>
</head>
<body>
  <h1>הכסף שלי</h1>
  <p class="sub">בדיקת היתכנות: שמירה, מסך בית, מצב טיסה ועדכונים</p>

  <div class="card" id="update">
    <p>גרסה חדשה מוכנה. ההערות שלך לא יימחקו.</p>
    <button id="updateBtn">עדכן עכשיו</button>
  </div>

  <div class="card">
    <h2>הערה חדשה</h2>
    <textarea id="noteText" placeholder="כתוב משהו, למשל: בדיקה ראשונה"></textarea>
    <button id="saveBtn">שמור</button>
  </div>

  <div class="card">
    <h2>מצב הבדיקות</h2>
    <div id="status"></div>
  </div>

  <div class="card">
    <h2>הערות שמורות (<span id="count">0</span>)</h2>
    <ul id="notes"></ul>
  </div>

<script>
// חייב להתאים ל-VERSION שבקובץ sw.js
const APP_VERSION = 1;
const DATA_VERSION = 1;

// ---------- שמירה (IndexedDB) ----------
function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('money-app', 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('notes')) db.createObjectStore('notes', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function run(db, store, mode, fn) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(store, mode);
    const req = fn(t.objectStore(store));
    t.oncomplete = () => resolve(req ? req.result : undefined);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error);
  });
}

const getMeta = (db, key) => run(db, 'meta', 'readonly', s => s.get(key));
const setMeta = (db, key, value) => run(db, 'meta', 'readwrite', s => s.put(value, key));

async function initMeta(db) {
  if (!(await getMeta(db, 'deviceId'))) {
    await setMeta(db, 'deviceId', crypto.randomUUID());
    await setMeta(db, 'firstOpened', new Date().toISOString());
    await setMeta(db, 'dataVersion', DATA_VERSION);
  }
  const seen = (await getMeta(db, 'versionsSeen')) || [];
  if (!seen.includes(APP_VERSION)) {
    seen.push(APP_VERSION);
    await setMeta(db, 'versionsSeen', seen);
  }
}

// ---------- תצוגה ----------
const fmt = iso => new Date(iso).toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' });
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yes = text => `<span class="ok">✓ ${text}</span>`;
const no = text => `<span class="bad">✗ ${text}</span>`;

let persisted = null;

async function render(db) {
  const notes = (await run(db, 'notes', 'readonly', s => s.getAll()))
    .sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  document.getElementById('count').textContent = notes.length;
  document.getElementById('notes').innerHTML = notes.length
    ? notes.map(n => `<li>${esc(n.text)}<div class="t">${fmt(n.createdAt)} · גרסה ${n.appVersion}</div></li>`).join('')
    : '<li class="empty">עדיין אין הערות</li>';

  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  const offlineReady = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
  const deviceId = await getMeta(db, 'deviceId');
  const seen = (await getMeta(db, 'versionsSeen')) || [];
  const rows = [
    ['נפתחה ממסך הבית', standalone ? yes('כן') : no('לא, נפתחה בדפדפן')],
    ['חיבור לאינטרנט', navigator.onLine ? 'מחובר' : 'לא מחובר'],
    ['מוכנה לעבוד בלי אינטרנט', offlineReady ? yes('כן') : no('עדיין לא. סגור ופתח שוב')],
    ['אחסון קבוע', persisted === null ? 'בודק…' : persisted ? yes('מאושר') : no('לא אושר')],
    ['גרסת אפליקציה', APP_VERSION],
    ['גרסאות שנפתחו במכשיר', seen.join(', ')],
    ['מזהה מכשיר', deviceId.slice(0, 6)],
    ['נפתחה לראשונה', fmt(await getMeta(db, 'firstOpened'))],
  ];
  document.getElementById('status').innerHTML =
    rows.map(([k, v]) => `<div class="row"><span>${k}</span><span class="v">${v}</span></div>`).join('');
}

// ---------- עדכונים (service worker) ----------
function setupServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    const offer = worker => {
      document.getElementById('update').style.display = 'block';
      document.getElementById('updateBtn').onclick = () => worker.postMessage('skipWaiting');
    };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w.addEventListener('statechange', () => {
        if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w);
      });
    });
    // אפליקציה ממסך הבית לא תמיד נטענת מחדש, אז בודקים עדכון בכל חזרה אליה
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') reg.update();
    });
  });
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });
}

// ---------- הפעלה ----------
(async () => {
  const db = await openDb();
  await initMeta(db);
  await render(db);

  if (navigator.storage && navigator.storage.persist) {
    persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist());
  } else {
    persisted = false;
  }
  await render(db);

  document.getElementById('saveBtn').onclick = async () => {
    const box = document.getElementById('noteText');
    const text = box.value.trim();
    if (!text) return;
    await run(db, 'notes', 'readwrite', s => s.put({
      id: crypto.randomUUID(), text, createdAt: new Date().toISOString(), appVersion: APP_VERSION,
    }));
    box.value = '';
    await render(db);
  };
  addEventListener('online', () => render(db));
  addEventListener('offline', () => render(db));
  navigator.serviceWorker && navigator.serviceWorker.addEventListener('controllerchange', () => render(db));

  setupServiceWorker();
})();
</script>
</body>
</html>
